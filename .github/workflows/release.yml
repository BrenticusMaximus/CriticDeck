name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package plugin zip
        run: |
          mkdir -p release/CriticDeck
          cp -r dist release/CriticDeck/
          cp main.py package.json plugin.json README.md release/CriticDeck/
          cd release
          # Stable, non-versioned filename for releases/latest/download/CriticDeck.zip
          zip -r CriticDeck.zip CriticDeck
          # Versioned copy, named after the pushed tag
          cp CriticDeck.zip "CriticDeck-${GITHUB_REF_NAME}.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/CriticDeck.zip
            release/CriticDeck-${{ github.ref_name }}.zip
          generate_release_notes: true
